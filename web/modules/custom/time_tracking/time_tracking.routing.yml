entity.time_log.settings:
  path: 'admin/structure/time-log'
  defaults:
    _form: '\Drupal\time_tracking\Form\TimeLogSettingsForm'
    _title: 'Time log'
  requirements:
    _permission: 'administer time_log'

drupaljira.timelog_debug.crud:
  path: '/admin/drupaljira/timelog-debug/crud/{task}'
  defaults:
    _controller: '\Drupal\time_tracking\Controller\TimeLogDebugController::crud'
    _title: 'Time log CRUD demo'
  requirements:
    _permission: 'access administration pages'
  options:
    parameters:
      task:
        type: 'entity:node'
        bundle:
          - task

drupaljira.timelog_debug.list:
  path: '/admin/drupaljira/timelog-debug/list/{task}'
  defaults:
    _controller: '\Drupal\time_tracking\Controller\TimeLogDebugController::listLogs'
    _title: 'Time logs of a task'
  requirements:
    _permission: 'access administration pages'
  options:
    parameters:
      task:
        type: 'entity:node'
        bundle:
          - task

drupaljira.timelog_debug.sum:
  path: '/admin/drupaljira/timelog-debug/sum/{task}'
  defaults:
    _controller: '\Drupal\time_tracking\Controller\TimeLogDebugController::sum'
    _title: 'Total logged hours'
  requirements:
    _permission: 'access administration pages'
  options:
    parameters:
      task:
        type: 'entity:node'
        bundle:
          - task
